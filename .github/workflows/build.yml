name: App bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signaturschlüssel aus den Secrets bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt – bitte unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ksv0815.jks"
          echo "KSV_KEYSTORE=$RUNNER_TEMP/ksv0815.jks" >> "$GITHUB_ENV"

      - name: Versionsnummer eintragen
        run: echo "window.KSV_VERSION = \"1.0.${{ github.run_number }}\"; window.KSV_BUILD = \"$(date -u +%Y-%m-%d)\";" > app/src/main/assets/version.js

      - name: Firebase-Bibliothek für die Vereins-Version einbinden
        run: bash scripts/firebase-sdk.sh

      - name: APK erstellen
        env:
          KSV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk KSV-0815.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KSV-0815-apk
          path: KSV-0815.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KSV 08/15 – Version 1.0.${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy unten **KSV-0815.apk** antippen und herunterladen,
            dann die Datei öffnen und „Installieren“ wählen.
          files: KSV-0815.apk

  # Browser-Version (z. B. für iPhones) auf GitHub Pages: https://certax91.github.io/CX-KSV0815/
  # Voraussetzung: Repository öffentlich und unter Settings → Pages als Quelle „GitHub Actions“ gewählt.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer eintragen
        run: echo "window.KSV_VERSION = \"1.0.${{ github.run_number }}\"; window.KSV_BUILD = \"$(date -u +%Y-%m-%d)\";" > app/src/main/assets/version.js

      - name: Firebase-Bibliothek einbinden
        run: bash scripts/firebase-sdk.sh

      - name: Web-Version zusammenstellen
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4

  # Browser-Version zusätzlich auf Firebase Hosting: https://ksv0815.web.app
  # Voraussetzung: GitHub-Secret FIREBASE_SERVICE_ACCOUNT (Dienstkonto-Schlüssel aus Firebase). Ohne Secret wird übersprungen.
  firebase:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - name: Versionsnummer eintragen
        if: env.HAS_KEY == 'true'
        run: echo "window.KSV_VERSION = \"1.0.${{ github.run_number }}\"; window.KSV_BUILD = \"$(date -u +%Y-%m-%d)\";" > app/src/main/assets/version.js

      - name: Firebase-Bibliothek einbinden
        if: env.HAS_KEY == 'true'
        run: bash scripts/firebase-sdk.sh

      - name: Web-Version zusammenstellen
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/. _site/

      - name: Auf Firebase Hosting veröffentlichen
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ksv0815

      - name: Hinweis
        if: env.HAS_KEY != 'true'
        run: echo "Kein Secret FIREBASE_SERVICE_ACCOUNT hinterlegt – Firebase Hosting wird übersprungen."
